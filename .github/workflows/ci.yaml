name: ci

on:
  push:
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ""
          - os: ubuntu-24.04-arm
            container: ""
          - os: macos-latest
            container: ""
          - os: ubuntu-latest
            container: archlinux:latest
            deps: pacman -Sy --noconfirm nodejs git curl sudo
          - os: ubuntu-latest
            container: fedora:latest
            deps: dnf install -y nodejs git curl sudo
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        if: matrix.deps != ''
        run: ${{ matrix.deps }}
      - name: Cache chezmoi binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/chezmoi
          key: chezmoi-${{ matrix.container || runner.os }}-${{ runner.arch }}
      - name: Run install script
        run: ./install.sh
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'
